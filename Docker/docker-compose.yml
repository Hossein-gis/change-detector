services:

  opencd-cpu:

    build:
      context: .
      dockerfile: Dockerfile
    image: opencd-cpu
    container_name: opencd-cpu
    shm_size: 8gb
    stdin_open: true
    tty: true
    working_dir: /workspace/open-cd
    command: bash
    volumes:
      - ../Data:/workspace/open-cd/data
      - ../Checkpoints:/workspace/open-cd/ckpt
      - ../OpenCD:/workspace/open-cd/files


