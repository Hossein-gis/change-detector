# ============================================================
# Project:      OpenCD Change Detection
# Version:      v1.0-gpu
# Purpose:      Docker Compose for change detection inference (GPU)
# Target GPU:   NVIDIA RTX 5080 (Blackwell, sm_120)
# ============================================================

services:
  opencd-gpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencd-gpu
    container_name: opencd-gpu
    shm_size: 8gb
    stdin_open: true
    tty: true
    working_dir: /workspace/open-cd
    command: bash
    volumes:
      - ../Data:/workspace/open-cd/data
      - ../Checkpoints:/workspace/open-cd/ckpt
      - ../OpenCD:/workspace/open-cd/files
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
